# Check every pull request and every push to main; publish the site only when the check is green.
# No AI and no secrets: only the project's own tests (ADR 019, ADR 020).
name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the browser for the smoke test
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Test every solution and build the site
        run: python build.py

      - name: docs/ must match the sources
        run: |
          if ! git diff --quiet -- docs/ || [ -n "$(git ls-files --others --exclude-standard -- docs/)" ]; then
            echo "::error::docs/ is out of date. Run 'python3 build.py' locally and commit docs/ together with your sources. Never edit docs/ by hand."
            git status --short -- docs/
            exit 1
          fi
          echo "docs/ is up to date."

      - name: Package the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    # Runs only on main, only after a green build. Pull requests are never published.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
